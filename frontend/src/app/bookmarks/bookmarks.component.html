<div class="page-container">
  <div class="page-header">
    <h1>My Bookmarks</h1>
    <p>Items you've saved for later</p>
  </div>

  <div class="bookmarks-grid" *ngIf="bookmarks.length > 0; else noBookmarks">
    <div class="bookmark-card" *ngFor="let bm of bookmarks" (click)="navigateToItem(bm)">
      <div class="card-header">
        <span class="badge" [ngClass]="bm.targetType.toLowerCase()">{{ bm.targetType }}</span>
        <button class="btn-icon unbookmark-btn" (click)="unbookmark(bm.id, bm.targetType, bm.targetId, $event)" title="Remove Bookmark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </button>
      </div>
      <div class="card-body">
        <h3 class="title">{{ bm.title }}</h3>
        <p *ngIf="bm.content" class="notice-body" [class.expanded]="expandedBookmarks[bm.id]" (click)="toggleExpand(bm.id, $event)" style="cursor:pointer; margin-top:8px;" title="Click to expand/collapse">
          {{ bm.content }}
        </p>
        <button *ngIf="bm.content && bm.content.length > 100" class="btn btn-link" style="padding:0; margin-top:4px; font-size:12px; color:var(--primary-color);" (click)="toggleExpand(bm.id, $event)">
          {{ expandedBookmarks[bm.id] ? 'Show less' : 'Read more' }}
        </button>
        <p class="date" style="margin-top:12px;">Saved on {{ bm.createdAt | date:'mediumDate' }}</p>
      </div>
    </div>
  </div>

  <ng-template #noBookmarks>
    <div class="empty-state">
      <div class="empty-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      </div>
      <h3>No bookmarks yet</h3>
      <p>Save notices and resources to find them easily later.</p>
    </div>
  </ng-template>
</div>
