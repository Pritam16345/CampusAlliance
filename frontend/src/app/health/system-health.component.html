<div class="page-container" style="max-width:1400px; padding:32px 48px;">

  <div class="page-header" style="align-items: center; justify-content:space-between; margin-bottom: 24px;">
    <div class="header-titles">
      <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">System Health & Audit</h1>
      <p style="color:var(--text-secondary); font-size: 15px;">Monitor platform stability and review administrative actions.</p>
    </div>
  </div>

  <div>
    <!-- Application Status -->
    <div class="card flex-col justify-between" style="max-width: 600px;">
      <div class="flex justify-between items-center mb-6">
        <h3 style="font-size: 18px; font-weight: 600;">Application Status</h3>
        <span class="status-badge status-up" *ngIf="health?.status === 'UP'">
          <span class="dot"></span> UP
        </span>
        <span class="status-badge status-down" *ngIf="health?.status !== 'UP'">
          <span class="dot"></span> DOWN
        </span>
      </div>

      <div class="status-row flex justify-between items-center">
        <span class="label">Database Connection</span>
        <span class="value success" [ngClass]="{'success': dbStatus === 'UP', 'text-danger': dbStatus !== 'UP'}">{{ dbStatus }}</span>
      </div>
      <div class="status-row flex justify-between items-center border-none">
        <span class="label">Storage Service</span>
        <span class="value success" [ngClass]="{'success': storageStatus === 'UP', 'text-danger': storageStatus !== 'UP'}">{{ storageStatus }}</span>
      </div>
    </div>
  </div>

</div>
